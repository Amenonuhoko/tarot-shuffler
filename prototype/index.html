<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070614">
<title>Tarot Pull · Sanctum (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sanctum.css">
</head>
<body class="view-intro">

<!-- The sky: one three.js canvas behind everything (sanctum.js). With no
     WebGL, body.no-webgl swaps in a CSS gradient night instead. -->
<canvas id="sky" class="sky" aria-hidden="true"></canvas>
<div class="sky-fallback" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<canvas id="fx" class="fx" aria-hidden="true"></canvas>
<div class="shooting-stars" aria-hidden="true"><span></span><span></span></div>

<!-- Arrival: the sky rises into view and tonight's moon is named. -->
<section id="intro" class="intro" aria-label="Welcome">
  <p class="intro-line intro-kicker">The sky over you tonight</p>
  <p class="intro-line intro-phase" id="introPhase"></p>
  <h1 class="intro-line intro-mark">Tarot Pull</h1>
  <p class="intro-line intro-tap">Tap to enter</p>
</section>

<header class="topbar">
  <button class="moon-chip" id="moonChip" type="button" aria-expanded="false" aria-controls="moonCard">
    <svg class="moon-icon" id="moonIcon" viewBox="-10 -10 20 20" aria-hidden="true"></svg>
    <span id="moonLabel"></span>
  </button>
  <div class="topbar-actions">
    <button class="icon-btn" id="skyBtn" type="button" aria-label="Your sky">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 9 8l5 6 6-9"/><circle cx="4" cy="17" r="1.6"/><circle cx="9" cy="8" r="1.6"/><circle cx="14" cy="14" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg>
    </button>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Turn sound on" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="sound-on" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4"/><path class="sound-off" d="m16 9.5 5 5m0-5-5 5"/></svg>
    </button>
  </div>
  <div class="moon-card" id="moonCard" hidden>
    <p class="moon-card-title" id="moonCardTitle"></p>
    <p class="moon-card-blurb" id="moonCardBlurb"></p>
    <p class="moon-card-next" id="moonCardNext"></p>
  </div>
</header>

<!-- The hub: tonight's card on the altar, the decks as constellations
     floating around it. Every place is also a plain button, in order. -->
<main id="hub" class="view hub" aria-label="Sanctum">
  <p class="greeting" id="greeting"></p>
  <nav class="portals" aria-label="Decks">
    <button class="portal" data-place="archetypes" type="button" style="--x: 50%; --y: 19%; --d: 0.6">
      <span class="portal-orb"><svg class="portal-map" viewBox="-14 -14 28 28" aria-hidden="true"></svg><svg class="portal-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"/><circle class="portal-ring-fill" cx="20" cy="20" r="18.5"/></svg></span>
      <span class="portal-name">Archetype Gate</span>
      <span class="portal-count"></span>
    </button>
    <button class="portal" data-place="tarot" type="button" style="--x: 21%; --y: 34%; --d: 1">
      <span class="portal-orb"><svg class="portal-map" viewBox="-14 -14 28 28" aria-hidden="true"></svg><svg class="portal-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"/><circle class="portal-ring-fill" cx="20" cy="20" r="18.5"/></svg></span>
      <span class="portal-name">Tarot Wheel</span>
      <span class="portal-count"></span>
    </button>
    <button class="portal" data-place="oracle" type="button" style="--x: 79%; --y: 34%; --d: 0.8">
      <span class="portal-orb"><svg class="portal-map" viewBox="-14 -14 28 28" aria-hidden="true"></svg><svg class="portal-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5"/><circle class="portal-ring-fill" cx="20" cy="20" r="18.5"/></svg></span>
      <span class="portal-name">Oracle Spiral</span>
      <span class="portal-count"></span>
    </button>
    <a class="portal portal-ball" href="../" id="askBallPortal" style="--x: 50%; --y: 44%; --d: 1.3">
      <span class="portal-orb portal-orb-ball" aria-hidden="true"><span class="ball-core"></span></span>
      <span class="portal-name">The Ask Ball</span>
      <span class="portal-count">yes · no · maybe</span>
    </a>
  </nav>

  <div class="altar">
    <span class="moonbeam" aria-hidden="true"></span>
    <button class="altar-card" id="altarCard" type="button" aria-label="Turn tonight's card">
      <span class="mini-card" id="altarMini"></span>
    </button>
    <button class="offering" id="offering" type="button" hidden aria-label="Something was left for you">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 15c-3-6-9-8-12-6 0 5 5 8 12 7zm0 0c3-6 9-8 12-6 0 5-5 8-12 7zm0 1c-2 4-6 7-9 6 0-3 4-6 9-6zm0 0c2 4 6 7 9 6 0-3-4-6-9-6z"/><path d="M16 11v12M14.5 8.5 16 11l1.5-2.5"/></svg>
    </button>
    <span class="plinth" aria-hidden="true"></span>
    <p class="altar-label" id="altarLabel">Tonight's card</p>
  </div>
</main>

<!-- A place: one deck's constellation overhead and its cards below. -->
<section id="place" class="view place" aria-label="Reading" hidden>
  <div class="place-top">
    <button class="back-btn" type="button" data-back>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      Sanctum
    </button>
    <p class="place-title"><span id="placeName"></span><span class="place-count" id="placeCount"></span></p>
  </div>
  <div class="stage" id="stage">
    <div class="deck-stack" id="deckStack" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="card3d" id="card" aria-hidden="true">
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front" id="cardFront"></div>
      </div>
      <span class="card-tell" aria-hidden="true"></span>
    </div>
  </div>
  <div class="reading" id="reading" aria-live="polite">
    <p class="r-kicker" id="rKicker"></p>
    <h2 class="r-name" id="rName"></h2>
    <p class="r-orient" id="rOrient"></p>
    <p class="r-meaning" id="rMeaning"></p>
    <p class="r-grimoire" id="rGrimoire"></p>
  </div>
  <p class="hint" id="placeHint">Tap the deck to draw</p>
</section>

<!-- Your sky: every card you've met is a lit star. -->
<section id="skyView" class="view sky-view" aria-label="Your sky" hidden>
  <div class="place-top">
    <button class="back-btn" type="button" data-back>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      Sanctum
    </button>
    <p class="place-title">Your sky</p>
  </div>
  <p class="sky-summary" id="skySummary"></p>
  <div class="star-labels" id="starLabels" aria-hidden="true"></div>
  <div class="sky-tabs" role="tablist" aria-label="Constellations">
    <button type="button" role="tab" data-sky-tab="tarot">Tarot Wheel</button>
    <button type="button" role="tab" data-sky-tab="oracle">Oracle Spiral</button>
    <button type="button" role="tab" data-sky-tab="archetypes">Archetype Gate</button>
  </div>
</section>

<div class="slip" id="slip" hidden>
  <div class="slip-paper">
    <p class="slip-kicker">Left on the altar while you were away</p>
    <p class="slip-text" id="slipText"></p>
    <button class="slip-close" type="button" id="slipClose">Keep it</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="sanctum.js"></script>
</body>
</html>
