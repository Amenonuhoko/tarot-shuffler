<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<title>Tarot Pull</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Grenze+Gotisch:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,500;1,500&family=Orbitron:wght@600;800&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="theme-switcher" id="themeSwitcher">
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Change design theme" aria-expanded="false" aria-controls="themeMenu">&#127912;</button>
  <div class="theme-menu" id="themeMenu" hidden>
    <p class="theme-menu-title">Preview design</p>
    <button class="theme-option" data-theme-value="" type="button">
      <span class="theme-swatch theme-swatch-mystic"></span>
      Mystic Violet <em>(current)</em>
    </button>
    <button class="theme-option" data-theme-value="celestial" type="button">
      <span class="theme-swatch theme-swatch-celestial"></span>
      Celestial Midnight
    </button>
    <button class="theme-option" data-theme-value="grimoire" type="button">
      <span class="theme-swatch theme-swatch-grimoire"></span>
      Vintage Grimoire
    </button>
    <button class="theme-option" data-theme-value="neon" type="button">
      <span class="theme-swatch theme-swatch-neon"></span>
      Neon Arcade
    </button>
    <button class="theme-option" data-theme-value="minimal" type="button">
      <span class="theme-swatch theme-swatch-minimal"></span>
      Minimalist Mono
    </button>
    <button class="theme-option" data-theme-value="gothic" type="button">
      <span class="theme-swatch theme-swatch-gothic"></span>
      Blood Moon Gothic
    </button>
  </div>
</div>

<div class="table">

  <main class="stage">
    <label class="deck-selector" for="deckSelect">
      <span>Deck</span>
      <select id="deckSelect" aria-label="Choose a deck">
        <option value="classical">Tarot of the Divine</option>
        <option value="custom">Oracle of the Divine</option>
      </select>
    </label>

    <div class="card-slot" id="cardSlot">
      <div class="card" id="card">
        <div class="card-face card-back" id="cardBack">
          <svg class="back-motif" viewBox="0 0 100 160" aria-hidden="true">
            <rect x="6" y="6" width="88" height="148" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="50" cy="80" r="26" fill="none" stroke="currentColor" stroke-width="1"/>
            <circle cx="50" cy="80" r="2" fill="currentColor"/>
            <path d="M50 34 L50 54 M50 106 L50 126 M20 80 L36 80 M64 80 L80 80" stroke="currentColor" stroke-width="1"/>
            <path d="M28 58 L38 68 M62 68 L72 58 M28 102 L38 92 M62 92 L72 102" stroke="currentColor" stroke-width="1"/>
          </svg>
        </div>
        <div class="card-face card-front" id="cardFront">
          <div class="card-front-content" id="cardFrontContent">
            <p class="arcana-label" id="arcanaLabel">Major Arcana</p>
            <p class="card-title" id="cardTitle">&mdash;</p>
            <div class="card-art" id="cardArt">
              <img class="card-art-img" id="cardArtImg" alt="">
              <svg class="card-art-fallback" id="cardArtFallback" viewBox="0 0 100 140" aria-hidden="true">
                <rect x="4" y="4" width="92" height="132" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
                <circle cx="50" cy="55" r="20" fill="none" stroke="currentColor" stroke-width="1"/>
                <path d="M30 100 Q50 82 70 100" fill="none" stroke="currentColor" stroke-width="1"/>
              </svg>
            </div>
            <div class="orientation-row" id="orientationRow">
              <p class="orientation-label" id="orientationLabel"></p>
              <button class="flip-btn" id="flipBtn" type="button" hidden aria-label="Flip card orientation">&#8644;</button>
            </div>
            <p class="card-description" id="cardDescription"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-group">
      <p class="hint" id="hint">Tap anywhere to pull a card</p>

      <div class="controls">
        <button class="btn btn-secondary" id="shuffleBtn" type="button">Shuffle</button>

        <div class="menu-wrap">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle history" aria-controls="historyPanel" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </div>

      <div class="history-panel" id="historyPanel" hidden>
        <div class="card-search">
          <input class="card-search-input" id="cardSearchInput" type="text" list="cardNamesList" placeholder="Search for a card&hellip;" autocomplete="off" aria-label="Search for a card">
          <button class="search-btn" id="cardSearchBtn" type="button" aria-label="Search">&#8981;</button>
        </div>
        <datalist id="cardNamesList"></datalist>

        <div class="history-header">
          <span>Recent pulls</span>
          <span class="history-count" id="historyCount">0 / 10</span>
        </div>
        <table class="history-table">
          <thead>
            <tr>
              <th aria-label="Card type">Type</th>
              <th>Card</th>
              <th>State</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="3" class="history-empty">No pulls yet</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

</div>

<footer class="support-footer">
  <a class="donate-link" href="https://paypal.me/skytale" target="_blank" rel="noopener noreferrer" aria-label="Support this project via PayPal">
    <svg class="paypal-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8.5 4h6.2c2.6 0 4.4 1.5 4.1 3.9-.4 3.4-2.7 5.1-5.9 5.1h-2c-.4 0-.7.3-.8.7l-.9 5.6c0 .2-.2.4-.4.4H5.8c-.3 0-.5-.3-.4-.6L8.1 4.4c.1-.2.2-.4.4-.4z" fill="#003087"/>
      <path d="M11 8h6.2c2.6 0 4.4 1.5 4.1 3.9-.4 3.4-2.7 5.1-5.9 5.1h-2c-.4 0-.7.3-.8.7l-.9 5.6c0 .2-.2.4-.4.4H8.3c-.3 0-.5-.3-.4-.6L10.6 8.4c.1-.2.2-.4.4-.4z" fill="#009cde" opacity="0.85"/>
    </svg>
    <span>Support on PayPal</span>
  </a>
</footer>

<script src="script.js"></script>
</body>
</html>
