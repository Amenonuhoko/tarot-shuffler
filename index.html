<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<title>Tarot Pull</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Grenze+Gotisch:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Cinzel:wght@500;600&family=Cinzel+Decorative:wght@400;700;900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<canvas class="terminal-rain" id="terminalRain" aria-hidden="true" hidden></canvas>

<div class="mystic-motif" aria-hidden="true">
  <svg class="motif-orbits" viewBox="0 0 300 300" fill="none" stroke="currentColor">
    <!-- chart rings: sun hub, house-numeral band, zodiac-symbol band,
         constellation band -->
    <circle cx="150" cy="150" r="40" stroke-width="0.6"/>
    <circle cx="150" cy="150" r="65" stroke-width="0.5"/>
    <circle cx="150" cy="150" r="100" stroke-width="0.6"/>
    <circle cx="150" cy="150" r="144" stroke-width="0.5"/>
    <!-- 12 sign-boundary spokes, exactly 30° apart, Aries at 9 o'clock -->
    <g stroke-width="0.4">
      <path d="M110,150 L6,150"/>
      <path d="M115.4,170 L25.3,222"/>
      <path d="M130,184.6 L78,274.7"/>
      <path d="M150,190 L150,294"/>
      <path d="M170,184.6 L222,274.7"/>
      <path d="M184.6,170 L274.7,222"/>
      <path d="M190,150 L294,150"/>
      <path d="M184.6,130 L274.7,78"/>
      <path d="M170,115.4 L222,25.3"/>
      <path d="M150,110 L150,6"/>
      <path d="M130,115.4 L78,25.3"/>
      <path d="M115.4,130 L25.3,78"/>
    </g>
    <!-- stylized sun face at the center -->
    <g class="motif-sun">
      <circle cx="150" cy="150" r="22" stroke-width="0.8"/>
      <g stroke-width="0.7">
        <path d="M126,150 L112,150"/>
        <path d="M129.2,162 L117.1,169"/>
        <path d="M138,170.8 L131,182.9"/>
        <path d="M150,174 L150,188"/>
        <path d="M162,170.8 L169,182.9"/>
        <path d="M170.8,162 L182.9,169"/>
        <path d="M174,150 L188,150"/>
        <path d="M170.8,138 L182.9,131"/>
        <path d="M162,129.2 L169,117.1"/>
        <path d="M150,126 L150,112"/>
        <path d="M138,129.2 L131,117.1"/>
        <path d="M129.2,138 L117.1,131"/>
      </g>
      <circle cx="142.5" cy="145" r="1.8" fill="currentColor" stroke="none"/>
      <circle cx="157.5" cy="145" r="1.8" fill="currentColor" stroke="none"/>
      <path d="M141,158 Q150,166 159,158" stroke-width="1"/>
    </g>
    <!-- house numerals I-XII, counterclockwise from Aries -->
    <g stroke="none" fill="currentColor" font-size="7" text-anchor="middle" dominant-baseline="central">
      <text x="99.8" y="163.5">I</text>
      <text x="113.2" y="186.8">II</text>
      <text x="136.5" y="200.2">III</text>
      <text x="163.5" y="200.2">IV</text>
      <text x="186.8" y="186.8">V</text>
      <text x="200.2" y="163.5">VI</text>
      <text x="200.2" y="136.5">VII</text>
      <text x="186.8" y="113.2">VIII</text>
      <text x="163.5" y="99.8">IX</text>
      <text x="136.5" y="99.8">X</text>
      <text x="113.2" y="113.2">XI</text>
      <text x="99.8" y="136.5">XII</text>
    </g>
    <!-- the 12 zodiac glyphs, centered in each wedge -->
    <g stroke="none" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
      <text x="70.8" y="171.2">&#9800;</text>
      <text x="92.0" y="208.0">&#9801;</text>
      <text x="128.8" y="229.2">&#9802;</text>
      <text x="171.2" y="229.2">&#9803;</text>
      <text x="208.0" y="208.0">&#9804;</text>
      <text x="229.2" y="171.2">&#9805;</text>
      <text x="229.2" y="128.8">&#9806;</text>
      <text x="208.0" y="92.0">&#9807;</text>
      <text x="171.2" y="70.8">&#9808;</text>
      <text x="128.8" y="70.8">&#9809;</text>
      <text x="92.0" y="92.0">&#9810;</text>
      <text x="70.8" y="128.8">&#9811;</text>
    </g>
    <!-- 12 zodiac constellations, one per wedge, outermost band -->
    <g stroke-width="0.6">
      <g transform="translate(34.1,181.1)">
        <path d="M-15,2 L-12,-8 L0,-14 L10,-6"/>
        <circle cx="-15" cy="2" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-12" cy="-8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="-14" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="-6" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(65.2,234.8)">
        <path d="M-14,-10 L0,8 L14,-10"/>
        <circle cx="-14" cy="-10" r="1" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="8" r="1.6" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="-10" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-10" cy="-16" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="-6" cy="-18" r="0.8" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(118.9,265.9)">
        <path d="M-10,-16 L-9,-1 L-8,14 M8,-14 L9,1 L10,16"/>
        <circle cx="-10" cy="-16" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-8" cy="14" r="1" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="-14" r="1" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="16" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(181.1,265.9)">
        <path d="M0,-14 L0,0 L-8,10 M0,0 L8,10"/>
        <circle cx="0" cy="-14" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="0" r="0.9" fill="currentColor" stroke="none"/>
        <circle cx="-8" cy="10" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="10" r="0.8" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(232.0,232.0)">
        <path d="M-16,-14 L-15,-4 L-10,2 L-4,4 L12,0 L16,10"/>
        <circle cx="-16" cy="-14" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-10" cy="2" r="1.5" fill="currentColor" stroke="none"/>
        <circle cx="-4" cy="4" r="1" fill="currentColor" stroke="none"/>
        <circle cx="16" cy="10" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(262.1,180.0)">
        <path d="M-14,-12 L-4,-16 L6,-10 L2,0 L-8,10 M2,0 L10,14"/>
        <circle cx="-14" cy="-12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="-10" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-8" cy="10" r="1" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(262.1,120.0)">
        <path d="M0,-16 L14,0 L0,16 L-14,0 Z"/>
        <circle cx="0" cy="-16" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="0" r="1" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="16" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="-14" cy="0" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(232.0,68.0)">
        <path d="M-14,-14 L-10,-4 L-4,2 L4,4 L10,0 L14,-8 L10,-14"/>
        <circle cx="-14" cy="-14" r="1" fill="currentColor" stroke="none"/>
        <circle cx="4" cy="4" r="1" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="-8" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="-14" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(180.0,37.9)">
        <path d="M-12,-8 L-14,2 L-6,10 L6,10 L10,0 L4,-10 L-6,-8 L-12,-8"/>
        <circle cx="-12" cy="-8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-6" cy="10" r="1" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="10" r="1" fill="currentColor" stroke="none"/>
        <circle cx="10" cy="0" r="1.3" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(120.0,37.9)">
        <path d="M-14,-6 L0,-14 L14,4 L6,12 Z"/>
        <circle cx="-14" cy="-6" r="1" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="-14" r="1" fill="currentColor" stroke="none"/>
        <circle cx="14" cy="4" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="12" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(68.0,68.0)">
        <path d="M0,-16 L0,-4 L-6,2 L-2,6 L-8,12 L-4,16"/>
        <circle cx="0" cy="-16" r="1" fill="currentColor" stroke="none"/>
        <circle cx="0" cy="-4" r="1.2" fill="currentColor" stroke="none"/>
        <circle cx="-8" cy="12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="-4" cy="16" r="1" fill="currentColor" stroke="none"/>
      </g>
      <g transform="translate(37.9,120.0)">
        <path d="M-16,-6 L-10,-12 L-6,-4 Z M-6,-4 L6,8 M6,8 L14,4 L16,12 Z"/>
        <circle cx="-10" cy="-12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="6" cy="8" r="1" fill="currentColor" stroke="none"/>
        <circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"/>
      </g>
    </g>
  </svg>
</div>

<div class="table">

  <main class="stage">
    <label class="deck-selector" for="deckSelect">
      <span>Deck</span>
      <select id="deckSelect" aria-label="Choose a deck">
        <option value="classical">Tarot of the Divine</option>
        <option value="custom">Oracle of the Divine</option>
      </select>
    </label>

    <div class="card-slot" id="cardSlot">
      <div class="card" id="card">
        <div class="card-face card-back" id="cardBack">
          <svg class="back-motif" viewBox="0 0 100 160" aria-hidden="true">
            <rect x="6" y="6" width="88" height="148" rx="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="50" cy="80" r="26" fill="none" stroke="currentColor" stroke-width="1"/>
            <circle cx="50" cy="80" r="2" fill="currentColor"/>
            <path d="M50 34 L50 54 M50 106 L50 126 M20 80 L36 80 M64 80 L80 80" stroke="currentColor" stroke-width="1"/>
            <path d="M28 58 L38 68 M62 68 L72 58 M28 102 L38 92 M62 92 L72 102" stroke="currentColor" stroke-width="1"/>
          </svg>
        </div>
        <div class="card-face card-front" id="cardFront">
          <svg class="mystic-frame" viewBox="0 0 300 500" preserveAspectRatio="none" aria-hidden="true">
            <rect x="8" y="8" width="284" height="484" rx="10" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="22 5 1.5 5" stroke-linecap="round"/>
            <g fill="currentColor" stroke="none">
              <path d="M10.9,10.9 L15.4,15.4 L10.9,19.9 L6.4,15.4 Z"/>
              <path d="M289.1,10.9 L293.6,15.4 L289.1,19.9 L284.6,15.4 Z"/>
              <path d="M10.9,489.1 L15.4,484.6 L10.9,480.1 L6.4,484.6 Z"/>
              <path d="M289.1,489.1 L293.6,484.6 L289.1,480.1 L284.6,484.6 Z"/>
            </g>
          </svg>
          <div class="card-front-content" id="cardFrontContent">
            <p class="arcana-label" id="arcanaLabel">Major Arcana</p>
            <p class="card-title" id="cardTitle">&mdash;</p>
            <div class="card-art" id="cardArt">
              <img class="card-art-img" id="cardArtImg" alt="">
              <svg class="card-art-fallback" id="cardArtFallback" viewBox="0 0 100 140" aria-hidden="true">
                <rect x="4" y="4" width="92" height="132" rx="3" fill="none" stroke="currentColor" stroke-width="1"/>
                <circle cx="50" cy="55" r="20" fill="none" stroke="currentColor" stroke-width="1"/>
                <path d="M30 100 Q50 82 70 100" fill="none" stroke="currentColor" stroke-width="1"/>
              </svg>
            </div>
            <div class="orientation-row" id="orientationRow">
              <p class="orientation-label" id="orientationLabel"></p>
              <button class="flip-btn" id="flipBtn" type="button" hidden aria-label="Flip card orientation">
                <svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 4 L11 4 M11 4 L8.5 1.5 M11 4 L8.5 6.5"/>
                  <path d="M12 10 L3 10 M3 10 L5.5 7.5 M3 10 L5.5 12.5"/>
                </svg>
              </button>
            </div>
            <p class="card-description" id="cardDescription"></p>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-group">
      <p class="hint" id="hint">Tap anywhere to pull a card</p>

      <div class="controls">
        <button class="btn btn-secondary" id="shuffleBtn" type="button">Shuffle</button>

        <div class="menu-wrap">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Toggle history" aria-controls="historyPanel" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>

        <div class="menu-wrap theme-wrap" id="themeSwitcher">
          <button class="menu-toggle theme-toggle" id="themeToggle" type="button" aria-label="Change design theme" aria-expanded="false" aria-controls="themeMenu"></button>
          <div class="theme-menu" id="themeMenu" hidden>
            <p class="theme-menu-title">Theme</p>
            <button class="theme-option" data-theme-value="" type="button">
              <span class="theme-swatch theme-swatch-mystic"></span>
              Mystic Violet <em class="theme-current-tag" hidden>(current)</em>
            </button>
            <button class="theme-option" data-theme-value="mystic-orbit" type="button">
              <span class="theme-swatch theme-swatch-mystic-orbit"></span>
              Preview: Orbit <em class="theme-current-tag" hidden>(current)</em>
            </button>
            <button class="theme-option" data-theme-value="holo" type="button">
              <span class="theme-swatch theme-swatch-holo"></span>
              Holographic Foil <em class="theme-current-tag" hidden>(current)</em>
            </button>
            <button class="theme-option" data-theme-value="terminal" type="button">
              <span class="theme-swatch theme-swatch-terminal"></span>
              Glitch Terminal <em class="theme-current-tag" hidden>(current)</em>
            </button>
            <button class="theme-option" data-theme-value="bloodmoon" type="button">
              <span class="theme-swatch theme-swatch-bloodmoon"></span>
              Blood Moon <em class="theme-current-tag" hidden>(current)</em>
            </button>
            <button class="theme-option" data-theme-value="deco" type="button">
              <span class="theme-swatch theme-swatch-deco"></span>
              Art Deco Luxe <em class="theme-current-tag" hidden>(current)</em>
            </button>
          </div>
        </div>
      </div>

      <div class="history-panel" id="historyPanel" hidden>
        <div class="card-search">
          <input class="card-search-input" id="cardSearchInput" type="text" list="cardNamesList" placeholder="Search for a card&hellip;" autocomplete="off" aria-label="Search for a card">
          <button class="search-btn" id="cardSearchBtn" type="button" aria-label="Search">&#8981;</button>
        </div>
        <datalist id="cardNamesList"></datalist>

        <div class="history-header">
          <span>Recent pulls</span>
          <span class="history-count" id="historyCount">0 / 10</span>
        </div>
        <table class="history-table">
          <thead>
            <tr>
              <th aria-label="Card type">Type</th>
              <th>Card</th>
              <th>State</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr>
              <td colspan="3" class="history-empty">No pulls yet</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

</div>

<footer class="support-footer">
  <a class="donate-link" href="https://paypal.me/skytale" target="_blank" rel="noopener noreferrer" aria-label="Support this project via PayPal">
    <svg class="paypal-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8.5 4h6.2c2.6 0 4.4 1.5 4.1 3.9-.4 3.4-2.7 5.1-5.9 5.1h-2c-.4 0-.7.3-.8.7l-.9 5.6c0 .2-.2.4-.4.4H5.8c-.3 0-.5-.3-.4-.6L8.1 4.4c.1-.2.2-.4.4-.4z" fill="#003087"/>
      <path d="M11 8h6.2c2.6 0 4.4 1.5 4.1 3.9-.4 3.4-2.7 5.1-5.9 5.1h-2c-.4 0-.7.3-.8.7l-.9 5.6c0 .2-.2.4-.4.4H8.3c-.3 0-.5-.3-.4-.6L10.6 8.4c.1-.2.2-.4.4-.4z" fill="#009cde" opacity="0.85"/>
    </svg>
    <span>Support on PayPal</span>
  </a>
</footer>

<script src="script.js"></script>
</body>
</html>
